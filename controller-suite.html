<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading Drive controller suite…</title>
  <style>
    html, body { height: 100%; margin: 0; background: #020617; color: #cbd5e1; font: 14px system-ui, sans-serif; }
    body { display: grid; place-items: center; }
  </style>
</head>
<body>
  <p id="loader">Loading the simulator with the additive Drive controller suite…</p>
  <script>
    (async () => {
      try {
        const response = await fetch('./index.html', { cache: 'no-store' });
        if (!response.ok) throw new Error(`index.html returned ${response.status}`);
        let source = await response.text();
        const appEntry = '<script type="module" src="./js/app.js?v=20260821-roll1"><' + '/script>';
        const suiteEntry = '<script type="module" src="./js/installDriveControllerSuite.js?v=20260821-drive-suite1"><' + '/script>';
        if (!source.includes(appEntry)) throw new Error('Could not locate the app entry point');
        source = source.replace(appEntry, suiteEntry + '\n  ' + appEntry);
        document.open();
        document.write(source);
        document.close();
      } catch (error) {
        document.getElementById('loader').textContent = `Controller suite failed to load: ${error.message}`;
      }
    })();
  </script>
</body>
</html>
